<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>दूध संकलन — Admin Panel</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>

  <style>
    body { font-family:'Noto Sans Devanagari', sans-serif; background:#f5f5f5; margin:0; }
    .box { max-width:500px; margin:40px auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#006400; }
    input, button { width:100%; padding:10px; margin:8px 0; font-size:16px; border-radius:6px; border:1px solid #ccc; }
    button { background:#006400; color:#fff; cursor:pointer; }
    button:hover { background:#004d00; }
    .msg { text-align:center; color:#006400; margin-top:10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Admin Panel — Milk Entry</h2>

    <input type="text" id="farmerId" placeholder="Farmer ID (उदा. 45)" />
    <input type="date" id="date" />
    <h3>🌞 सकाळचा तपशील</h3>
    <input type="number" id="morningLitres" placeholder="सकाळचे लिटर" />
    <input type="number" id="morningRate" placeholder="दर (₹)" />

    <h3>🌙 सायंकाळचा तपशील</h3>
    <input type="number" id="nightLitres" placeholder="सायंकाळचे लिटर" />
    <input type="number" id="nightRate" placeholder="दर (₹)" />

    <button onclick="saveRecord()">रेकॉर्ड जतन करा</button>
    <p id="msg" class="msg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, update } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDAPIylSFOKGA6Tpu8kmn2otF4L0SpQh6g",
      authDomain: "mcollections-22e3f.firebaseapp.com",
      databaseURL: "https://mcollections-22e3f-default-rtdb.firebaseio.com",
      projectId: "mcollections-22e3f",
      storageBucket: "mcollections-22e3f.firebasestorage.app",
      messagingSenderId: "798498490029",
      appId: "1:798498490029:web:86db83ee562a2d2f12e824",
      measurementId: "G-5LEYGZJQCY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.saveRecord = async function(){
      const farmerId = document.getElementById('farmerId').value.trim();
      const date = document.getElementById('date').value;
      const mL = parseFloat(document.getElementById('morningLitres').value) || 0;
      const mR = parseFloat(document.getElementById('morningRate').value) || 0;
      const nL = parseFloat(document.getElementById('nightLitres').value) || 0;
      const nR = parseFloat(document.getElementById('nightRate').value) || 0;

      if(!farmerId || !date){ alert("कृपया आयडी आणि दिनांक भरा!"); return; }

      const totalMorning = mL * mR;
      const totalNight = nL * nR;

      const recordRef = ref(db, "farmers/" + farmerId + "/records/" + date);
      await update(recordRef, {
        day: { litres: mL, rate: mR, amount: totalMorning },
        night: { litres: nL, rate: nR, amount: totalNight },
        payment_status: "pending"
      });

      document.getElementById('msg').innerText = "✅ रेकॉर्ड यशस्वीरीत्या जतन झाले!";
      document.getElementById('farmerId').value = '';
      document.getElementById('date').value = '';
      document.getElementById('morningLitres').value = '';
      document.getElementById('morningRate').value = '';
      document.getElementById('nightLitres').value = '';
      document.getElementById('nightRate').value = '';
    }
  </script>
</body>
</html>
